 class="mode"><div class="icon">🇬🇭</div><h3>Ghana Regional</h3><p class="muted">Regional challenges, school squads and national events.</p><button class="secondary" onclick="toast('Ghana competition mode selected')">Explore</button></div><div class="mode"><div class="icon">🌍</div><h3>Worldwide</h3><p class="muted">Open challenges for students beyond Ghana.</p><button class="primary" onclick="toast('Worldwide competition mode selected')">Explore</button></div></div><div style="height:14px"></div><div class="sectionTitle"><div><div class="eyebrow">Server judged</div><h2>Global Challenges</h2></div><span class="tag">Weekly + Monthly</span></div><div class="challenge"><span class="tag">WEEKLY • 2026-W40</span><h2>Incident Analysis: The Silent Redirect</h2><p class="muted">A student receives an urgent school-account message. The visible URL looks legitimate, but the redirect chain leads to an unfamiliar domain. Explain the investigation steps you would take before interacting with the account, and identify the evidence that would make the incident report credible.</p><p><b>⏱ 2 days remaining</b> • First-to-submit slot: <span style="color:#55d8ff">Open</span></p><textarea placeholder="Write your answer in your own words..."></textarea><button class="primary" style="margin-top:10px" onclick="toast('Prototype: submission will be saved by the V3 backend when connected.')">Submit Answer</button></div><div class="challenge" style="margin-top:14px"><span class="tag">MONTHLY • OCTOBER 2026</span><h2>National Cyber Defense Case</h2><p class="muted">Analyze a fictional multi-stage social-engineering incident affecting a school community. Produce a concise defensive response plan, evidence checklist and communication strategy.</p><textarea placeholder="Monthly challenge response..."></textarea><button class="primary" style="margin-top:10px" onclick="toast('Prototype: monthly submission endpoint ready for backend integration.')">Submit Monthly Answer</button></div>`,videos:`<div class="sectionTitle"><div><div class="eyebrow">Watch & Learn</div><h2>CyberShield Video Hub</h2></div><span class="tag">YouTube • Curated</span></div><div class="card" style="margin-bottom:16px"><p class="muted">No more 2D placeholder videos here. These are real educational YouTube videos embedded into the platform. YouTube supports website embeds; Privacy-Enhanced Mode uses youtube-nocookie.com. citeturn1search8</p></div><div class="videoGrid"><article class="videoCard"><div class="videoFrame"><iframe src="https://www.youtube-nocookie.com/embed/BnmneAjVrM4" title="What is Phishing? by Kaspersky" loading="lazy" allowfullscreen></iframe></div><div class="videoBody"><span class="tag">PHISHING</span><h3>What is Phishing?</h3><p class="muted">A beginner-friendly introduction to phishing and how attackers try to trick people.</p><button class="secondary" onclick="window.open('https://www.youtube.com/watch?v=BnmneAjVrM4','_blank')">Watch on YouTube</button></div></article><article class="videoCard"><div class="videoFrame"><iframe src="https://www.youtube-nocookie.com/embed/qpeesJMiBo4" title="What is phishing? by edX" loading="lazy" allowfullscreen></iframe></div><div class="videoBody"><span class="tag">CYBER AWARENESS</span><h3>What is phishing? #cybersecurity</h3><p class="muted">Practical awareness guidance from edX for recognizing phishing attacks.</p><button class="secondary" onclick="window.open('https://www.youtube.com/watch?v=qpeesJMiBo4','_blank')">Watch on YouTube</button></div></article><article class="videoCard"><div class="videoFrame"><iframe src="https://www.youtube-nocookie.com/embed/TeaqH9riVd4" title="Social Engineering by U.S. Customs and Border Protection" loading="lazy" allowfullscreen></iframe></div><div class="videoBody"><span class="tag">SOCIAL ENGINEERING</span><h3>Social Engineering</h3><p class="muted">A public-sector awareness resource covering social-engineering concepts.</p><button class="secondary" onclick="window.open('https://www.youtube.com/watch?v=TeaqH9riVd4','_blank')">Watch on YouTube</button></div></article><article class="card"><div class="icon">⭐</div><h3>Video Roadmap</h3><p class="muted">Next: password security • MFA • safe browsing • ransomware awareness • incident response.</p><button class="primary" onclick="toast('Video roadmap saved for the next platform release')">Add to roadmap</button></article></div>`,
security:`<div class="sectionTitle"><div><div class="eyebrow">Platform Security</div><h2>CyberShield Security Center</h2></div><span class="tag">V3.1 architecture</span></div><div class="card" style="margin-bottom:14px"><h3>🔐 Admin account protection</h3><p class="muted">The frontend must never contain an admin password, secret API key or database credential. The real admin account should be protected on the server with strong password hashing, MFA/passkeys, secure sessions, role-based access control, rate limiting, audit logs and recovery controls.</p></div><div class="securityGrid"><div class="check"><div class="ok">●</div><div><strong>HTTPS only</strong><span class="small muted">Production site should force secure HTTPS connections.</span></div></div><div class="check"><div class="ok">●</div><div><strong>Server-side authorization</strong><span class="small muted">Admin permissions are checked by the backend, not by hidden buttons.</span></div></div><div class="check"><div class="ok">●</div><div><strong>Password hashing</strong><span class="small muted">Passwords should be hashed on the server using a modern password-hashing algorithm.</span></div></div><div class="check"><div class="ok">●</div><div><strong>MFA / Passkeys</strong><span class="small muted">Admin access should require a second factor or passkey.</span></div></div><div class="check"><div class="warn">●</div><div><strong>Rate limiting</strong><span class="small muted">Login and sensitive endpoints need throttling and abuse protection.</span></div></div><div class="check"><div class="warn">●</div><div><strong>Audit logs</strong><span class="small muted">Record important admin actions for investigation and accountability.</span></div></div></div><div class="card" style="margin-top:14px"><h3>🧩 Production architecture</h3><div class="architecture">Student Browser
   ↓ HTTPS
Web App / Frontend
   ↓ authenticated API
Backend API + RBAC
   ├── Authentication + MFA
   ├── Competition engine
   ├── Progress / XP service
   ├── Moderation + reports
   └── Admin audit service
          ↓
Encrypted Database</div><p class="small muted">This V3.1 file is still a frontend prototype. The architecture above is the target; it does not magically create a secure backend inside one HTML file.</p></div><div class="card" style="margin-top:14px"><h3>🛡️ Admin rules</h3><div class="list"><div class="row"><span>1</span><div class="grow"><b>Never put admin secrets in HTML/JavaScript</b><div class="small muted">Use environment secrets on the server.</div></div></div><div class="row"><span>2</span><div class="grow"><b>Separate admin and student roles</b><div class="small muted">Use least privilege and server-side checks.</div></div></div><div class="row"><span>3</span><div class="grow"><b>Protect competition judging</b><div class="small muted">Do not trust XP, scores or submissions sent by the browser.</div></div></div></div></div>`,
leaderboard:`<div class="sectionTitle"><div><div class="eyebrow">Global Rank</div><h2>Live Leaderboard</h2></div><span class="tag">REAL USERS ONLY</span></div><div class="card"><p class="muted">In production this list comes from the secure database. New deployments begin empty — no fake students are inserted.</p><div class="list"><div class="row"><div class="rank">1</div><div class="avatar">🛡️</div><div class="grow"><b>CyberShield Global</b><div class="small muted">Example UI row — hidden when backend is live</div></div><div class="xp">— XP</div></div></div></div>`,profile:`<div class="sectionTitle"><div><div class="eyebrow">Progress</div><h2>My Profile</h2></div></div><div class="profile"><div class="card" style="text-align:center"><img class="char" style="height:190px" src="__IMG__"><h2>Cyber Defender</h2><span class="tag">Level 7</span><p class="muted">Country: Ghana<br>School: Optional<br>Joined: —</p><button class="secondary">Edit Profile</button></div><div><div class="card"><h3>Progress</h3><p>1,240 / 1,500 XP to Level 8</p><div class="bar"><span style="width:83%"></span></div><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted">Missions</span><b>18</b></div><div class="stat"><span class="muted">Academy</span><b>40%</b></div><div class="stat"><span class="muted">Competitions</span><b>6</b></div></div></div><div class="card" style="margin-top:14px"><h3>🏆 Trophy Cabinet</h3><div class="badgeGrid">${[['🎣','Phishing Slayer'],['🔑','Password Master'],['🧪','Crypto Cadet'],['🕵️','Digital Investigator'],['🌐','Network Defender'],['👑','Cyber Commander'],['🏆','Competition Champion'],['⚡','7-Day Streak']].map((b,i)=>`<div class="badge ${i>4?'locked':''}"><div style="font-size:28px">${b[0]}</div><b>${b[1]}</b><div class="small muted">${i>4?'Locked':'Earned'}</div></div>`).join('')}</div></div></div></div>`,more:`<div class="sectionTitle"><div><div class="eyebrow">Explore</div><h2>CyberShield V3</h2></div></div><div class="grid">${[['📚','Glossary','Search cybersecurity terms in student-friendly language.'],['🧩','Daily Cipher','A new puzzle every 24 hours with streak XP.'],['🗣️','Defender Q&A','Ask questions and share safe defensive knowledge.'],['📰','Threat Feed','Verified advisories clearly separated from simulations.'],['👥','Squads','Build regional, school and global teams.'],['📜','Certificates','Earn verifiable completion certificates.'],['🚨','Report a Threat','Find official reporting guidance for your country.'],['💬','Feedback','Send suggestions or report platform problems.'],['🛡️','Security Center','Platform security architecture and admin protection plan.'],['👑','Admin Console','Restricted admin workspace for feedback, moderation and platform operations.']].map(a=>`<div class="card"><div class="icon">${a[0]}</div><h3>${a[1]}</h3><p class="muted">${a[2]}</p><button class="secondary" onclick="${a[1]==='Security Center'?'go(\'security\')':a[1]==='Feedback'?'go(\'feedback\')':a[1]==='Admin Console'?'go(\'admin\')':'toast(\'Opening '+a[1]+'\')'}">Open</button></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>🌍 Language</h3><select><option>English</option><option>Français</option><option>Español</option><option>Português</option><option>العربية</option><option>中文</option><option>日本語</option><option>한국어</option><option>Deutsch</option><option>हिन्दी</option></select><p class="small muted">V3 production: the selected language follows the account across devices.</p></div>`,feedback:`<section class="section"><div class="eyebrow">CyberShield Student • User Support</div><h2>💬 Send Feedback</h2><p class="muted">Tell the CyberShield team what is working, what is broken, or what you want added. Your submission is designed to appear in the Admin Feedback Inbox.</p><div class="feedbackGrid"><div class="card feedbackForm"><h3>New feedback</h3><label for="fbName">Name</label><input id="fbName" placeholder="Your name"><label for="fbType">Feedback type</label><select id="fbType"><option>Suggestion</option><option>Problem / Bug</option><option>Competition</option><option>Academy / Learning</option><option>Safety / Security</option><option>General</option></select><label for="fbMessage">Message</label><textarea id="fbMessage" placeholder="Describe your feedback..."></textarea><label for="fbContact">Contact (optional)</label><input id="fbContact" placeholder="Email or username"><button class="primary" style="margin-top:14px" onclick="submitFeedback()">Send to CyberShield Admin</button></div><div class="card"><h3>🔗 How the link works</h3><div class="check"><span>✓</span><div><strong>User submission</strong><span class="muted">Your feedback gets a unique ID and timestamp.</span></div></div><div class="check"><span>✓</span><div><strong>Admin inbox</strong><span class="muted">Admins can see the message, status and category.</span></div></div><div class="check"><span>✓</span><div><strong>Response</strong><span class="muted">The admin can mark it reviewed and record a response.</span></div></div><p class="small muted" style="margin-top:14px">Connection note: the form now sends feedback to the CyberShield backend over HTTPS when it is configured. If the backend is unavailable, the browser-only demo fallback is used so you can still demonstrate the flow.</p><button class="secondary" onclick="go('admin')">Open Admin Feedback Inbox</button></div></div></section>`,
admin:`<section class="section"><div class="eyebrow">CyberShield Student • Admin Platform</div><h2>👑 Admin Console</h2><p class="muted">Central workspace for platform feedback and moderation. Production authentication and permissions must be enforced by the backend.</p><div class="adminStats"><div class="adminStat"><span class="muted">Total feedback</span><b id="adminTotal">0</b></div><div class="adminStat"><span class="muted">New</span><b id="adminNew">0</b></div><div class="adminStat"><span class="muted">Reviewed</span><b id="adminReviewed">0</b></div><div class="adminStat"><span class="muted">Problems</span><b id="adminProblems">0</b></div></div><div class="adminShell" style="margin-top:16px"><aside class="card adminSide"><h3>Admin tools</h3><button class="secondary" onclick="renderAdminFeedback()">💬 Feedback Inbox</button><button class="secondary" onclick="toast('Student management will connect to the backend')">👥 Students</button><button class="secondary" onclick="toast('Competition controls will connect to the backend')">🏆 Competitions</button><button class="secondary" onclick="go('security')">🛡️ Security Center</button></aside><div class="card"><div class="feedbackMeta"><div><h3 style="margin:0">Feedback Inbox</h3><p class="muted small">User feedback received by CyberShield</p></div><button class="secondary" onclick="renderAdminFeedback()">↻ Refresh</button></div><div id="adminFeedbackList"></div></div></div></section>`,
};function getFeedback(){try{return JSON.parse(localStorage.getItem("cybershield_feedback")||"[]")}catch(e){return[]}}function saveFeedback(x){localStorage.setItem("cybershield_feedback",JSON.stringify(x))}function getAdminToken(){return sessionStorage.getItem("cybershield_admin_token")||""}async function apiRequest(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};const token=getAdminToken();if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(`${API_BASE_URL}${path}`,{...options,headers,credentials:"include"});if(!r.ok){let msg=`Request failed (${r.status})`;try{const j=await r.json();msg=j.message||j.error||msg}catch(e){}throw new Error(msg)}return r.status===204?null:r.json()}async function submitFeedback(){const message=document.getElementById("fbMessage")?.value.trim();if(!message){toast("Please write your feedback first.");return}const payload={name:document.getElementById("fbName")?.value.trim()||"Anonymous student",type:document.getElementById("fbType")?.value||"General",message,contact:document.getElementById("fbContact")?.value.trim()||""};try{const saved=await apiRequest("/feedback",{method:"POST",body:JSON.stringify(payload)});document.getElementById("fbMessage").value="";document.getElementById("fbContact").value="";toast(`Feedback sent to Admin${saved?.id?` • ${saved.id}`:""}.`)}catch(e){const items=getFeedback();items.unshift({id:"FB-"+Date.now().toString(36).toUpperCase(),...payload,status:"New",response:"",createdAt:new Date().toISOString(),syncStatus:"offline-demo"});saveFeedback(items);document.getElementById("fbMessage").value="";document.getElementById("fbContact").value="";toast("Backend unavailable — saved in demo mode on this device.")}}async function renderAdminFeedback(){const list=document.getElementById("adminFeedbackList");if(!list)return;let items=[];let live=false;try{items=await apiRequest("/admin/feedback");if(!Array.isArray(items))items=items?.feedback||items?.data||[];live=true}catch(e){items=getFeedback()}const total=document.getElementById("adminTotal"),nw=document.getElementById("adminNew"),rev=document.getElementById("adminReviewed"),prob=document.getElementById("adminProblems");if(total)total.textContent=items.length;if(nw)nw.textContent=items.filter(x=>x.status==="New"||x.status==="new").length;if(rev)rev.textContent=items.filter(x=>x.status==="Reviewed"||x.status==="reviewed").length;if(prob)prob.textContent=items.filter(x=>x.type==="Problem / Bug").length;if(!items.length){list.innerHTML=`<div class="check"><span>💬</span><div><strong>No feedback yet</strong><span class="muted">User submissions will appear here.</span></div></div>`;return}list.innerHTML=`<div class="small muted" style="margin-bottom:10px">${live?"🟢 Live backend inbox":"🟡 Local demo inbox — connect the backend for multi-user data"}</div>`+items.map((x,i)=>{const d=new Date(x.createdAt||x.created_at||Date.now());return `<article class="feedbackItem ${x.status==="New"||x.status==="new"?"unread":""}"><div class="feedbackMeta"><div><strong>${escapeHtml(x.type||x.category||"General")}</strong> <span class="statusPill">${escapeHtml(x.status||"New")}</span></div><span class="small muted">${escapeHtml(x.id||x._id||"—")} • ${escapeHtml(d.toLocaleString())}</span></div><p><strong>${escapeHtml(x.name||"Anonymous student")}</strong>${x.contact?` · ${escapeHtml(x.contact)}`:""}</p><p class="muted" style="white-space:pre-wrap">${escapeHtml(x.message||"")}</p>${x.response?`<div class="replyBox"><strong>Admin response</strong><p class="muted" style="white-space:pre-wrap">${escapeHtml(x.response)}</p></div>`:""}<div class="replyBox"><textarea id="reply-${i}" placeholder="Write an admin response..."></textarea><button class="primary" style="margin-top:8px" onclick="replyFeedback(${i},${live?"true":"false"})">Reply & mark reviewed</button></div></article>`}).join("");window.__adminFeedbackItems=items}async function replyFeedback(index,live){const items=window.__adminFeedbackItems||getFeedback();const item=items[index];if(!item)return;const box=document.getElementById("reply-"+index);const response=box?.value.trim();if(!response){toast("Write a response first.");return}try{if(live){const id=encodeURIComponent(item.id||item._id);await apiRequest(`/admin/feedback/${id}`,{method:"PATCH",body:JSON.stringify({response,status:"Reviewed"})})}else{items[index].response=response;items[index].status="Reviewed";items[index].reviewedAt=new Date().toISOString();saveFeedback(items)}await renderAdminFeedback();toast("Feedback marked as reviewed.")}catch(e){toast("Could not save the admin response: "+e.message)}}function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.querySelectorAll('.bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.b===p));app.innerHTML=pages[p].replaceAll('__IMG__',img);scrollTo({top:0,behavior:'smooth'})}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));document.querySelectorAll('.bottomNav button').forEach(b=>b.onclick=()=>go(b.dataset.b));go('home');</script></body></html>
